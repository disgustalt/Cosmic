<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="/all.css">
    <title>Weather</title>
    <script>
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Asap+Sharp:ital,wght@0,100..900;1,100..900&family=Orbitron:wght@400..900&display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Redaction:ital,wght@0,400;0,700;1,400&display=swap');

      * {
        box-sizing: border-box;
      }
      @property --bg1 {
        syntax: "<color>";
        inherits: true;
        initial-value: rgba(130, 175, 255, .0.65);
      }

      @property --bg2 {
        syntax: "<color>";
        inherits: true;
        initial-value: rgba(170, 145, 255, 0.65);
      }

      @property --bg2 {
        syntax: "<color>";
        inherits: true;
        initial-value: rgba(130, 180, 255, 0.65);
      }
      
      body {
        display: flex;
        width: 100vw;
        min-height: 100vh;
        margin: 0;
        isolation: isolate;
        flex-direction: column;
        align-items: center;
        overflow-x: hidden;
        background: rgba(25, 25, 45, 0.9);
      }

      body::before {
        content: "";
        position: fixed;
        background:
          radial-gradient(ellipse at 0% 10%, var(--bg1), transparent 45%),
          radial-gradient(ellipse at 100% 20%, var(--bg1), transparent 45%),
          radial-gradient(ellipse at 10% 100%, var(--bg2), transparent 45%),
          radial-gradient(ellipse at 100% 100%, var(--bg2), transparent 45%),
          radial-gradient(ellipse at 50% 0%, var(--bg3), transparent 45%),
          radial-gradient(ellipse at 50% 100%, var(--bg3), transparent 45%);
        background-size: 200% 200%;
        opacity: 0.8;
        filter: blur(30px);
        animation: bgm 15s ease-in-out infinite alternate;
        transition: --bg1 2s ease, --bg2 2s ease 0.6s, --bg3 2s ease 1.2s;
      }

      main {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 30px;
      }

      @keyframes bgm {
        0% {
          background-position: 0% 0%;
          opacity: 0.5;
        }
        50% {
          background-position: 100% 50%;
          opacity: 0.9;
        }
        100% {
          background-position: 0% 100%;
          opacity: 0.7;
        }
      }
    </style>
  </head>
</html>
