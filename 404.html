<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Hmm...looks like you're lost</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/all.css">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Asap+Sharp:ital,wght@0,100..900;1,100..900&family=Orbitron:wght@400..900&display=swap');
      
      body {
        position: relative;
        color: #a0bef2;
        background-size: cover;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      
      h1 {
        font-family: "Orbitron", sans-serif;
        font-weight: 550;
        font-size: 45px;
        margin-bottom: 10px;
      }

      .de {
        font-family: "Asap Sharp", sans-serif;
        opacity: 0.4;
        margin-top: 0;
      }

      .gb {
        font-family: "Asap Sharp", sans-serif;
      }

      a {
        width: 60px;
        height: 60px;
        touch-action: none;
        color: #a0bef2;
        background: linear-gradient(130deg, rgba(160, 190, 242, 0.15), rgba(11, 20, 40, 0.3));
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1), 0 4px 18px rgba(0, 0, 0, 0.2);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        border: solid 1px rgba(160, 190, 242, 0.1);
        transition: all 0.3s ease;
      }

      a:hover {
        background: linear-gradient(130deg, rgba(160, 190, 242, 0.25), rgba(11, 20, 40, 0.5));
        border-color: rgba(160, 190, 242, 0.3);
        transform: translateY(-2px);
        box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.15), 0 0 18px rgba(0, 0, 0, 0.3);
      }

      .lucide-house {
        width: 40px;
        height: 40px;
        stroke-width: 1.4;
      }
    </style>
  </head>
  <body>
    <h1>404</h1>
    <p class="de">This page doesn't exist!</p>
    <p class="gb">Are you lost? Let's get back to the homepage! :D</p>
    <a href="/home"><i data-lucide="house"></i></a>
  </body>
  <script>
    lucide.createIcons();
  </script>
</html>
