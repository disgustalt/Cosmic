<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Home</title>
    <link rel="stylesheet" href="all.css">
    <style>
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .hero {
        position: relative;
        min-height: 650px;
        isolation: isolate;
        width: 100%;
        flex-shrink: 0;
        top: 0;
      }

      .hero::before {
        content: "";
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: var(--apodimg);
        -webkit-mask-image: linear-gradient(to bottom, black 0%, black 40%, transparent 100%);
        mask-image: linear-gradient(to bottom, black 0%, black 40%, transparent 100%);
        z-index: -1;
      }

      .hero .content {
        position: relative;
      }
    </style>
    <script>
      const d = {
        apod: {
          img: null,
          desc: null,
          title: null
        }
      }

      async function apod() {
        try {
          const res = await fetch("https://science.nasa.gov/wp-json/wp/v2/apod-basic");

          if (!res.ok) {
            alert("We couldn't get the info we need :(");
            return;
          }

          const dat = await res.json();
          console.log(dat);
          
          d.apod = {
            title: dat[0].title,
            img: dat[0].hdurl || dat[0].url,
            desc: dat[0].explanation
          }
        } catch (e) {
          console.log(e);
          alert("Something wemt wrong!");
        }
      }

      const apodl = apod();

      document.addEventListener("DOMContentLoaded", async () => {
        await apodl;
        document.querySelector(".hero").style.setProperty("--apodimg", `url(${d.apod.img})`);
      });
    </script>
  </head>
  <body>
    <div class="hero">
      <div class="content">
        trst
      </div>
    </div>
  </body>
</html>
